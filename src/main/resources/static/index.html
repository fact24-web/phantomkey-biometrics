<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhantomKey • Neural Keystroke Defense</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --cyan: #00f0ff;
      --purple: #8b5cf6;
      --green: #10b981;
      --red: #ff0055;
      --bg: #030712;
      --card: rgba(13, 19, 33, 0.75);
      --border: rgba(0, 240, 255, 0.15);
      --border-glow: rgba(0, 240, 255, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .hud-shell {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .hud-shell::before {
      content: "";
      position: absolute;
      top: -1px; left: 10%; width: 80%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-text span {
      font-size: 0.72rem;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }

    .vault-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 8px #64748b;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .status-dot.danger {
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 22px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 10px;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .mode-btn.active {
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .terminal-box {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .terminal-box span.code {
      color: var(--cyan);
      font-weight: 600;
    }

    .input-zone {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 18px 20px;
      border-radius: 14px;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.05);
    }

    .wave-visualizer {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .wave-bar {
      width: 4px;
      border-radius: 2px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: height 0.15s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .console-foot {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-stream {
      color: var(--cyan);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }
  </style>
</head>
<body>

  <div class="hud-shell">
    <div class="hud-top">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PhantomKey Core</h1>
          <span>STEALTH BIOMETRIC ENGINE v2.6</span>
        </div>
      </div>
      <div class="vault-status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusLabel">LOCKED</span>
      </div>
    </div>

    <div class="mode-switch">
      <button id="enrollTab" class="mode-btn active" onclick="setMode('enroll')">01. Enroll Pattern</button>
      <button id="verifyTab" class="mode-btn" onclick="setMode('verify')">02. Verify Cadence</button>
    </div>

    <div class="terminal-box" id="guideText">
      [PROTOCOL] Type decoy notes. Rhythm will be extracted strictly from <span class="code">Backspace</span>, <span class="code">Shift</span>, or <span class="code">Tab</span>. Hit <span class="code">Enter</span> to commit.
    </div>

    <div class="input-zone">
      <input type="text" id="inputField" placeholder="Type decoy text or trigger rhythm..." autocomplete="off">
    </div>

    <!-- Live Dynamic Waveform -->
    <div class="wave-visualizer" id="waveVisualizer">
      <span style="font-family:'JetBrains Mono'; font-size: 0.65rem; color:#475569;">CADENCE FREQ</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">TRIGGERS</div>
        <div id="triggerVal" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">LAST DWELL</div>
        <div id="dwellVal" class="stat-value">-- ms</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PERSISTENCE</div>
        <div class="stat-value" style="color: var(--cyan);">H2 / JPA</div>
      </div>
    </div>

    <div class="console-foot">
      <span style="color: #64748b;">SYSTEM:</span>
      <span id="logStream" class="log-stream">Listening on port 8080...</span>
    </div>
  </div>

  <script>
    let mode = 'enroll';
    let activeKeys = {};
    let vector = [];
    let lastKeyUp = 0;

    const STEALTH_KEYS = new Set(['Backspace', 'Shift', 'Tab', 'Control', 'Alt']);

    const inputField = document.getElementById('inputField');
    const triggerVal = document.getElementById('triggerVal');
    const dwellVal = document.getElementById('dwellVal');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const logStream = document.getElementById('logStream');
    const waveVisualizer = document.getElementById('waveVisualizer');
    const guideText = document.getElementById('guideText');

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('enrollTab').classList.toggle('active', mode === 'enroll');
      document.getElementById('verifyTab').classList.toggle('active', mode === 'verify');
      inputField.value = '';
      resetCapture();

      if (mode === 'enroll') {
        guideText.innerHTML = '[ENROLL MODE] Tap stealth keys (<span class="code">Backspace / Shift</span>) to register pattern into H2 DB. Press <span class="code">Enter</span>.';
        statusLabel.innerText = 'ENROLL READY';
        statusDot.className = 'status-dot';
      } else {
        guideText.innerHTML = '[VERIFY MODE] Replicate your natural rhythm timing. Press <span class="code">Enter</span> to verify against stored vector.';
        statusLabel.innerText = 'ARMED';
        statusDot.className = 'status-dot';
      }
    }

    function resetCapture() {
      activeKeys = {};
      vector = [];
      lastKeyUp = 0;
      triggerVal.innerText = '0';
      dwellVal.innerText = '-- ms';
      waveVisualizer.innerHTML = '<span style="font-family:\'JetBrains Mono\'; font-size: 0.65rem; color:#475569;">CADENCE FREQ</span>';
    }

    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitVector();
        return;
      }

      if (e.key === 'Tab') {
        e.preventDefault();
      }

      if (STEALTH_KEYS.has(e.key) && !activeKeys[e.key]) {
        const pressTime = performance.now();
        const flightTime = lastKeyUp === 0 ? 0 : (pressTime - lastKeyUp);
        activeKeys[e.key] = { down: pressTime, flight: flightTime };
      }
    });

    inputField.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') return;
      if (e.key === 'Tab') e.preventDefault();

      if (STEALTH_KEYS.has(e.key) && activeKeys[e.key]) {
        const releaseTime = performance.now();
        const dwell = releaseTime - activeKeys[e.key].down;

        vector.push({
          key: e.key.toLowerCase(),
          dwellTime: dwell,
          flightTime: activeKeys[e.key].flight
        });

        lastKeyUp = releaseTime;
        delete activeKeys[e.key];

        // Update live stats
        triggerVal.innerText = vector.length;
        dwellVal.innerText = `${Math.round(dwell)} ms`;

        // Add dynamic frequency bar
        const barHeight = Math.min(24, Math.max(8, dwell / 6));
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        bar.style.height = `${barHeight}px`;
        waveVisualizer.appendChild(bar);
      }
    });

    async function submitVector() {
      if (vector.length === 0) {
        logStream.style.color = '#ff0055';
        logStream.innerText = 'Error: 0 triggers logged.';
        return;
      }

      const endpoint = mode === 'enroll' ? '/api/v1/auth/enroll' : '/api/v1/auth/verify';
      logStream.style.color = 'var(--cyan)';
      logStream.innerText = 'Transmitting vector payload...';

      try {
        const res = await fetch(`http://localhost:8080${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: 'primary-agent',
            cadenceVector: vector
          })
        });

        const data = await res.json();

        if (res.ok) {
          if (mode === 'enroll') {
            logStream.style.color = 'var(--green)';
            logStream.innerText = `Enrolled ${vector.length} triggers in H2 DB`;
            statusDot.className = 'status-dot active';
            statusLabel.innerText = 'ENROLLED';
            setTimeout(() => setMode('verify'), 1200);
          } else {
            logStream.style.color = 'var(--green)';
            logStream.innerText = `Access Granted: ${data.token.substring(0, 20)}...`;
            statusDot.className = 'status-dot active';
            statusLabel.innerText = 'VAULT UNLOCKED';
          }
        } else {
          logStream.style.color = 'var(--red)';
          logStream.innerText = data.message || 'Verification Rejected';
          statusDot.className = 'status-dot danger';
          statusLabel.innerText = 'ACCESS DENIED';
        }
      } catch (err) {
        logStream.style.color = 'var(--red)';
        logStream.innerText = 'Connection failure.';
      } finally {
        inputField.value = '';
        resetCapture();
      }
    }
  </script>
</body>
</html>
